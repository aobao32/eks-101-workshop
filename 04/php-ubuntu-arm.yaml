---
apiVersion: v1
kind: Namespace
metadata:
  name: mydemo3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mydemo3
  name: php-ubuntu
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: php-ubuntu
  replicas: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: php-ubuntu
    spec:
      containers:
      - image: 133129065110.dkr.ecr.ap-southeast-1.amazonaws.com/mydemo3:latest
        imagePullPolicy: Always
        name: php-ubuntu
        ports:
        - containerPort: 80
      nodeSelector:
        kubernetes.io/arch: arm64
---
apiVersion: v1
kind: Service
metadata:
  namespace: mydemo3
  name: php-ubuntu
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: NodePort
  selector:
    app.kubernetes.io/name: php-ubuntu
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: mydemo3
  name: ingress-for-php-ubuntu-app
  labels:
    app: ingress-for-php-ubuntu-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: php-ubuntu
            port:
              number: 80
